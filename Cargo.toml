[package]
name = "iroh-live-draw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "iroh-live-draw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[workspace]
resolver = "2"
members = ["shared", "browser-wasm"]

[workspace.dependencies]
# we define iroh dependencies here to make upgrading easier.
iroh = { version = "1.0.0", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1.0.0"
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
