[package]
name = "keeper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "keeper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
draw-shared = { path = "../shared" }
futures-util = "0.3"
iroh = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
