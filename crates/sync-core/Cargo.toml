[package]
name = "sync-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "0.34", default-features = false }
hex = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
futures-util = "0.3"
futures-channel = "0.3"
anyhow = "1"
# Unifies the `wasm_js` feature onto iroh's transitive getrandom (browser RNG).
getrandom = { version = "0.3", features = ["wasm_js"] }
# Pin: precis-profiles 0.1.14 bumped precis-core to 0.2, which stun-rs 0.1.11
# can't compile against (it pins precis-core 0.1.11). Hold the last good pair.
precis-profiles = "=0.1.12"
