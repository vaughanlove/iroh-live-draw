<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>pen · stroke test bench</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23d8e8d0'/><path d='M3 13 L13 3' stroke='%231e4620' stroke-width='2'/></svg>"/>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background-color: #d8e8d0;
    background-image:
      linear-gradient(rgba(123,174,123,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(123,174,123,0.4) 1px, transparent 1px);
    background-size: 20px 20px;
    font-family: ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
    color: #1e4620;
    touch-action: none;
  }
  /* Isometric drafting grid: 30° / 90° / 150° axes.
     (background-size MUST reset: repeating gradients tile themselves;
     the base 20px size would dice them into dots.) */
  body.iso {
    background-image:
      repeating-linear-gradient(30deg, rgba(123,174,123,0.4) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(150deg, rgba(123,174,123,0.4) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, rgba(123,174,123,0.4) 0 1px, transparent 1px 24px);
    background-size: auto;
  }
  #pad { position: fixed; inset: 0; touch-action: none; cursor: crosshair; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: #d8e8d0; border: 2px solid #1e4620; border-radius: 4px;
    box-shadow: 3px 3px 0 #1e4620; padding: 8px 10px; font-size: 12px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    max-width: min(560px, 92vw);
  }
  #hud .title { font-weight: 800; letter-spacing: 1px; }
  #hud label { display: flex; gap: 6px; align-items: center; }
  #hud button {
    background: #eef4e4; color: #1e4620; border: 1.5px solid #1e4620;
    border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer;
  }
  #readout { opacity: 0.75; }
</style>
</head>
<body>
<canvas id="pad"></canvas>
<div id="hud">
  <span class="title">PEN BENCH</span>
  <label>size <input id="size" type="range" min="2" max="24" step="1" value="8"></label>
  <label><input id="sharpie" type="checkbox" checked> sharpie</label>
  <button id="iso">iso grid</button>
  <button id="clear">clear</button>
  <span id="readout">loading wasm…</span>
</div>
<script type="module" src="./demo.js"></script>
</body>
</html>
